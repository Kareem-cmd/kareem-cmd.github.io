<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>المستنير — استوديو البنرات</title><style>
@font-face{font-family:Amiri;src:url('assets/display.ttf')}@font-face{font-family:Noto;src:url('assets/body.ttf')}*{box-sizing:border-box}html,body{margin:0;background:#123b29}body{font-family:Noto,sans-serif}.canvas{width:1920px;height:800px;position:relative;overflow:hidden;color:#fff8e9}.art{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}.logo{position:absolute;top:57px;right:125px;background:#fff;padding:17px 25px;width:420px;height:auto}.copy{position:absolute;right:125px;top:205px;width:770px}h1{font:400 112px/1.24 Amiri,serif;margin:0 0 22px;text-wrap:balance}p{font:400 26px/1.9 Noto,sans-serif;margin:0 0 30px}.cta{display:inline-flex;align-items:center;gap:40px;background:#fff8e9;color:#153f30;padding:19px 34px;font:400 24px/1.6 Noto;min-width:320px;justify-content:center}.cta svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.5}.light{color:#153f30}.light .cta{background:#153f30;color:#fff8e9}.light .logo{background:rgba(255,255,255,.87)}.portrait{width:1080px;height:1350px}.portrait .logo{top:48px;right:80px;width:550px;padding:17px 26px}.portrait .copy{top:210px;right:80px;width:920px}.portrait h1{font-size:94px;line-height:1.22;margin-bottom:16px}.portrait p{font-size:28px;line-height:1.7;margin-bottom:24px}.portrait .cta{font-size:26px;padding:17px 30px;min-width:340px}.portrait .art{object-fit:cover}
.portrait{width:1080px;height:1080px}.portrait .logo{top:65px;right:70px;width:480px;padding:16px 22px}.portrait .copy{top:auto;bottom:80px;right:70px;width:525px}.portrait h1{font-size:88px;line-height:1.27;margin-bottom:26px}.portrait p{font-size:36px;line-height:1.8;margin-bottom:30px}.portrait .cta{font-size:34px;line-height:1.6;padding:20px 24px;min-width:410px;gap:24px}.portrait .art{object-fit:cover} .canvas[data-campaign="bulk"] h1{font-size:100px}.portrait[data-campaign="bulk"] h1{font-size:80px}.portrait[data-campaign="hero"] h1{font-size:74px}.canvas:not(.portrait)[data-campaign="bulk"] h1{font-size:90px}</style></head><body><main class="canvas"><img class="art" alt=""><img class="logo" src="assets/logo.png" alt="شركة المستنير للتجارة الدولية"><div class="copy"><h1></h1><p></p><div class="cta"><span></span><svg viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></svg></div></div></main><script>
const q=new URLSearchParams(location.search),name=q.get('campaign')||'hero',size=q.get('size')||'desktop';
const campaigns={hero:{title:'للضيافة أصول.<br>وللقهوة… المستنير.',copy:'بنّ وهيل، وتفاصيل تصنع لحظة الضيافة.',cta:'اكتشف التشكيلة',light:false},coffee:{title:'من قلب الحبة،<br>تبدأ الحكاية.',copy:'اكتشف أصناف البنّ، واختر بداية فنجانك.',cta:'تصفّح البنّ',light:true},cardamom:{title:'حبّة صغيرة.<br>حضور لا يُنسى.',copy:'تشكيلة هيل أبو طيارة… لتكتمل النكهة.',cta:'اكتشف الهيل',light:true},bulk:{title:'لأهل البنّ،<br>بداية بحجم طموحك.',copy:'عبوات للمحامص والمتاجر. جهّز اختياراتك.',cta:'اكتشف عبوات الجملة',light:false}};
const c=campaigns[name]||campaigns.hero;if(size==='mobile'){if(name==='hero')c.title='للضيافة أصول.<br>وللقهوة…<br>المستنير.';if(name==='bulk'){c.title='لأهل البنّ،<br>اختيارات<br>بحجم طموحك.';c.copy='للمحامص والمتاجر.'}if(name==='coffee')c.copy='اختر بداية فنجانك.';if(name==='cardamom')c.copy='هيل أبو طيارة…<br>لتكتمل النكهة.';if(name==='hero')c.copy='بنّ وهيل،<br>بروح الضيافة.'}document.querySelector('.canvas').dataset.campaign=name;document.querySelector('.canvas').classList.toggle('portrait',size==='mobile');document.querySelector('.canvas').classList.toggle('light',c.light);document.querySelector('.art').src=`assets/art-v2/${name}-${size}.webp`;document.querySelector('h1').innerHTML=c.title;document.querySelector('p').innerHTML=c.copy;document.querySelector('.cta span').textContent=c.cta;
</script></body></html>
