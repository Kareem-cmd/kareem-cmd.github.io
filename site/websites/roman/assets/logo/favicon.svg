<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Roman Dahy">
  <!-- Background void disc -->
  <rect width="64" height="64" rx="14" fill="#07050D"/>

  <!-- Violet aura -->
  <circle cx="32" cy="32" r="20" fill="url(#aura)" opacity="0.55"/>

  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B2EFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5B2EFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Compact RD nodes mark -->
  <g stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.95">
    <!-- R -->
    <line x1="16" y1="20" x2="16" y2="44"/>
    <line x1="16" y1="20" x2="26" y2="20"/>
    <line x1="26" y1="20" x2="29" y2="28"/>
    <line x1="29" y1="28" x2="16" y2="32"/>
    <line x1="22" y1="32" x2="30" y2="44"/>
    <!-- D -->
    <line x1="38" y1="20" x2="38" y2="44"/>
    <line x1="38" y1="20" x2="46" y2="22"/>
    <line x1="46" y1="22" x2="50" y2="32"/>
    <line x1="50" y1="32" x2="46" y2="42"/>
    <line x1="46" y1="42" x2="38" y2="44"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="16" cy="20" r="1.6"/>
    <circle cx="16" cy="32" r="1.6"/>
    <circle cx="16" cy="44" r="1.6"/>
    <circle cx="26" cy="20" r="1.6"/>
    <circle cx="29" cy="28" r="1.6"/>
    <circle cx="30" cy="44" r="1.6"/>
    <circle cx="38" cy="20" r="1.6"/>
    <circle cx="38" cy="32" r="1.6"/>
    <circle cx="38" cy="44" r="1.6"/>
    <circle cx="46" cy="22" r="1.6"/>
    <circle cx="50" cy="32" r="2.2"/>
    <circle cx="46" cy="42" r="1.6"/>
  </g>
</svg>
